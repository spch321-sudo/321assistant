<style>:root{--bg:#F4F0E8;--card:#FDFBF6;--ink:#25304A;--sub:#6B7285;--tag:#EAE4D6;--line:#E4DDCF;--acc:#8A5A2B;--acc2:#B9894F;--red:#A0452E;--redbg:#F6E3DE;--ok:#3F7A4F;--okbg:#E2EFE3;--hl:#FBE7A6;--fs:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:var(--fs);line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:760px;margin:0 auto;padding:0 16px 120px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.top h1{font-size:1.05em;margin:0;flex:1;line-height:1.35}
.back{border:0;background:var(--tag);border-radius:12px;padding:6px 12px;cursor:pointer}
.hero{padding:22px 0 8px}
.hero h1{font-size:1.5em;margin:0 0 4px;letter-spacing:.02em}
.hero p{margin:0;color:var(--sub);font-size:.9em}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(60,40,10,.04)}
.row{display:flex;align-items:center;gap:14px}
.badge{flex:none;width:56px;height:56px;border-radius:16px;background:var(--tag);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.2em;color:var(--sub)}
.badge.done{background:var(--okbg);color:var(--ok)}
.grow{flex:1;min-width:0}
.ttl{font-weight:700;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--tag);border-radius:999px;padding:2px 12px;font-size:.78em}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.red{background:var(--redbg);color:var(--red)}
.bar{height:8px;background:var(--tag);border-radius:8px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--acc2);border-radius:8px}
.muted{color:var(--sub);font-size:.88em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;min-height:84px}
.tile b{display:block;margin-bottom:2px}
.tile span{font-size:.8em;color:var(--sub)}
.tabs{display:flex;gap:6px;background:var(--tag);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:8px 4px;cursor:pointer;font-size:.9em}
.tabs button.on{background:var(--card);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.doc h2{font-size:1.2em;margin:28px 0 10px;padding-top:6px;border-top:1px solid var(--line)}
.doc h3{font-size:1.05em;margin:20px 0 8px;color:var(--acc)}
.doc p,.doc li{margin:0 0 12px}
.rd{border-radius:8px;transition:background .2s;cursor:pointer}
.rd.hl{background:var(--hl)}
.rd.spk{outline:2px solid var(--acc2);background:#FFF4DC}
.note{background:#F1ECE1;border-left:3px solid var(--acc2);padding:6px 10px;margin:-6px 0 12px;font-size:.85em;border-radius:6px;white-space:pre-wrap}
.tw{overflow-x:auto;margin:0 0 14px}
table{border-collapse:collapse;width:100%;font-size:.86em;background:var(--card)}
th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{background:var(--tag)}
.info{display:grid;grid-template-columns:6.5em 1fr;gap:6px 10px;font-size:.9em}
.info b{color:var(--sub);font-weight:600}
.btn{border:0;background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn.alt{background:var(--tag);color:var(--ink)}
.btn.warn{background:var(--red)}
.btn[disabled]{opacity:.4}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;margin:8px 0;cursor:pointer}
.opt.pick{border-color:var(--acc2);background:#FFF6E6}
.opt.best{border-color:var(--ok);background:var(--okbg)}
.opt small{display:block;color:var(--sub);margin-top:4px}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
label.ck input{width:22px;height:22px;flex:none;margin-top:4px;accent-color:var(--acc)}
textarea,input[type=text],input[type=date],input[type=number],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;margin:4px 0 10px}
textarea{min-height:76px;resize:vertical}
.fl{font-size:.85em;color:var(--sub);display:block}
#sheet{position:fixed;inset:0;background:rgba(20,20,30,.35);display:none;z-index:20;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .pan{background:var(--card);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:.85em;display:none;z-index:30}
#spkbar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;display:none;z-index:15;padding:10px 16px calc(10px + env(safe-area-inset-bottom));justify-content:center;gap:10px}
#spkbar.on{display:flex}
#spkbar button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer}
.chat{max-height:52vh;overflow:auto;margin:10px 0}
.msg{padding:10px 12px;border-radius:14px;margin:8px 0;white-space:pre-wrap;font-size:.92em}
.msg.u{background:var(--tag);margin-left:18%}
.msg.a{background:#fff;border:1px solid var(--line);margin-right:8%}
.lock{min-height:90vh;display:flex;flex-direction:column;justify-content:center}
.warnbox{background:var(--redbg);color:var(--red);border-radius:12px;padding:10px 12px;font-size:.85em;margin:8px 0}
.okbox{background:var(--okbg);color:var(--ok);border-radius:12px;padding:10px 12px;font-size:.9em;margin:8px 0}
.cert{text-align:center;border:3px double var(--acc2);padding:28px 18px;background:#FFFDF8}
.cert h2{margin:6px 0;font-size:1.4em}
svg text{font-family:inherit}
@media print{.top,.btns,#spkbar{display:none}body{background:#fff}}
:root{--surface:var(--card);--sunk:#F1ECE1;--muted:var(--sub);--accent:#1F4E6B;--accent-soft:rgba(31,78,107,.10);--red-soft:rgba(160,69,46,.10);--crit:#B4561C;
--hl-gold:#F5E6C4;--hl-green:#DDEFD9;--hl-blue:#DCE7F7;--hl-pink:#FADDE4;--hl-purple:#E8DEF4;--hl-maroon:#F0DADA;--hl-brown:#EEE1CD;--hl-charcoal:#E3E2DE;--reading:#D6E3F7;--serif:"Noto Serif TC","PMingLiU","Songti TC",serif}
#doc .sent{cursor:pointer;border-radius:2px}
.sent[data-hl]{background:linear-gradient(transparent 55%,var(--hl-gold) 55%)}
.sent[data-color="green"]{background:linear-gradient(transparent 55%,var(--hl-green) 55%)}
.sent[data-color="blue"]{background:linear-gradient(transparent 55%,var(--hl-blue) 55%)}
.sent[data-color="pink"]{background:linear-gradient(transparent 55%,var(--hl-pink) 55%)}
.sent[data-color="purple"]{background:linear-gradient(transparent 55%,var(--hl-purple) 55%)}
.sent[data-color="maroon"]{background:linear-gradient(transparent 55%,var(--hl-maroon) 55%)}
.sent[data-color="brown"]{background:linear-gradient(transparent 55%,var(--hl-brown) 55%)}
.sent[data-color="charcoal"]{background:linear-gradient(transparent 55%,var(--hl-charcoal) 55%)}
.sent.tts-reading{box-shadow:inset 0 0 0 999px var(--reading);-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:box-shadow .2s}
.hl-note{margin:6px 0 12px;padding:8px 12px;background:var(--sunk);border-left:3px solid #D9B168;border-radius:6px;font-size:.85em;white-space:pre-wrap;line-height:1.6}
.hl-note[data-color="green"]{border-left-color:#6FAE71}.hl-note[data-color="blue"]{border-left-color:#6C93D1}.hl-note[data-color="pink"]{border-left-color:#E58FA0}.hl-note[data-color="purple"]{border-left-color:#A48AC9}.hl-note[data-color="maroon"]{border-left-color:#8C4A4E}.hl-note[data-color="brown"]{border-left-color:#8A6740}.hl-note[data-color="charcoal"]{border-left-color:#54534E}
.hlsheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end}
.hlsheet-card{background:var(--surface);width:100%;max-width:720px;margin:0 auto;max-height:86vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.hlsheet-title{font-weight:700}
.hlsheet-quote{background:var(--hl-gold);border-radius:8px;padding:10px 12px;font-family:var(--serif);line-height:1.8}
.hlsheet-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hlsheet-label{font-size:.8em;color:var(--muted);min-width:2.5em}
.hlsheet-colors{display:flex;gap:10px;flex-wrap:wrap}
.hlswatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.hlswatch.active{border-color:var(--ink)}
.spanrow{display:flex;align-items:center;gap:8px}
.spanbtn{min-width:38px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.spannum{font-size:.85em;color:var(--muted);min-width:3em;text-align:center}
.hl-hint{margin:0;font-size:.78em;color:var(--muted)}
.hlsheet-ta,.chatinput textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;background:var(--sunk);color:var(--ink);resize:vertical;margin:0}
.hlsheet-ta{min-height:84px}
.hlsheet-acts{display:flex;gap:8px}
.sbtn{flex:1;border-radius:10px;padding:10px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.sbtn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.sbtn.danger{color:var(--crit);border-color:var(--crit)}
.readbar{display:flex;flex-direction:column;gap:6px}
.readbtn[data-state="playing"],.readbtn[data-state="loading"]{background:var(--accent)}
.chatwrap{display:flex;flex-direction:column;gap:10px}
.chatctx{align-self:flex-start;font-size:.78em;color:var(--muted);background:var(--sunk);border-radius:999px;padding:4px 12px}
.qs-toggle{align-self:flex-start;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 14px;font-size:.82em;font-weight:700}
.qs-panel{border:1px solid var(--line);border-radius:12px;background:var(--sunk);padding:10px;display:flex;flex-direction:column;gap:6px}
.qs-chip{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:.85em;line-height:1.5}
.chatlog{display:flex;flex-direction:column;gap:10px;min-height:120px}
.chatlog.rp{max-height:52vh;overflow:auto;min-height:60px;margin:10px 0}
.msg{max-width:92%;padding:10px 14px;border-radius:14px;line-height:1.8;margin:0;white-space:normal;font-size:1em}
.msg.user{background:var(--accent);color:#fff;margin-left:auto;border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.ai{background:var(--surface);border:1px solid var(--line);margin-right:auto;border-bottom-left-radius:4px}
.msg.ai p{margin:0 0 8px}.msg.ai p:last-child{margin-bottom:0}
.msg.ai h4{margin:12px 0 4px;font-size:1em;color:var(--accent);font-family:var(--serif)}
.msg.ai blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--red);background:var(--red-soft);border-radius:0 8px 8px 0;font-family:var(--serif)}
.msg.ai ul{margin:4px 0 8px;padding-left:20px}.msg.ai li{margin-bottom:4px}
.msg.ai hr{border:none;border-top:1px solid var(--line);margin:10px 0}
.msg.ai .mdtb{display:block;width:100%;overflow-x:auto;border-collapse:collapse;margin:10px 0;font-size:.88em}
.msg.ai .mdtb th,.msg.ai .mdtb td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.msg.ai .mdtb th{background:var(--sunk)}
.msg .sent{cursor:pointer}
.msg-actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;padding-top:6px;border-top:1px solid var(--line)}
.msg-act{border:none;background:transparent;color:var(--muted);font-size:.78em;padding:4px 8px;border-radius:999px}
.msg-act.on{color:var(--accent);font-weight:700}
.chatinput{display:flex;gap:8px;position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:8px}
.chatinput textarea{resize:none;max-height:120px}
.chatinput button{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:0 16px;font-weight:700;white-space:nowrap;flex:0 0 auto}
.chatnote{margin:0;font-size:.74em}
.msg-q{font-weight:700;font-size:.9em;color:var(--accent);margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.msg.col .msg-body{max-height:10.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.msg-more{display:none;border:none;background:none;color:var(--accent);font-size:.82em;font-weight:700;padding:4px 0}
.msg.col .msg-more{display:block}
.hllist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.hlitem{display:flex;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.hlbar{flex:0 0 5px;border-radius:3px}
.hlmeta{display:flex;flex-direction:column;gap:4px;min-width:0}
.hlsrc{font-size:.72em;color:var(--muted)}
.hlt{font-family:var(--serif);line-height:1.7}
.hln{font-size:.82em;background:var(--sunk);border-radius:6px;padding:4px 8px;white-space:pre-wrap}
.updbar{position:fixed;left:0;right:0;top:0;z-index:60;border:none;background:#B98A2E;color:#fff;font-weight:700;font-size:.9em;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.cardpv{background:var(--sunk);border-radius:12px;overflow:hidden;text-align:center}
.cardpv img{max-width:100%;max-height:48vh;display:block;margin:0 auto;-webkit-touch-callout:default;user-select:auto}
.cchips{display:flex;gap:6px;flex-wrap:wrap}
.cchip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:.82em;font-weight:500}
.cchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.brandicon{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.homeicon{width:64px;height:64px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
[hidden]{display:none!important}
.bigcode{font-size:2.6em;font-weight:800;letter-spacing:10px;margin:4px 0;color:var(--accent)}
.lamps{display:flex;gap:6px;justify-content:space-between;margin-top:8px}
.lamp{flex:1;text-align:center;cursor:pointer;font-size:.78em;color:#6B7285}
.lamp i{display:block;width:26px;height:26px;margin:0 auto 4px;border-radius:50%;background:#E4DDCF;border:2px solid #D6CDBB}
.lamp.on i{background:radial-gradient(circle at 40% 35%,#FFF3C4,#E8B84A 60%,#C48A1E);border-color:#C48A1E;box-shadow:0 0 10px rgba(232,184,74,.7)}
.lamp.on{color:#25304A;font-weight:700}

<script>var DATA=null;

function $(id) { return document.getElementById(id); }

function il(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
function plain(s) { return String(s).replace(/\*\*/g, ''); }
function hash(s) { var x = 5381, i; for (i = 0; i < s.length; i++) { x = ((x << 5) + x + s.charCodeAt(i)) | 0; } return (x >>> 0).toString(36); }
function norm(c) { return String(c || '').toUpperCase().replace(/[\s\-_]/g, ''); }
function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function daysSince(d) { if (!d) return 9999; var a = d.split('-'); return Math.floor((new Date() - new Date(+a[0], +a[1] - 1, +a[2])) / 864e5); }

function fix(s) {
  var n;
  s.auth = s.auth || {};
  s.les = s.les || {};
  for (n = 1; n <= NLES; n++) { s.les[n] = s.les[n] || {}; var L = s.les[n]; L.hl = L.hl || {}; L.nt = L.nt || {}; L.st = L.st || {}; L.tk = L.tk || {}; L.rf = L.rf || {}; if (L.sc === undefined) L.sc = null; L.done = L.done || 0; L.pos = L.pos || 0; }
  s.led = s.led || []; s.one = s.one || []; s.obs = s.obs || []; s.suc = s.suc || [];
  s.agg = s.agg || {}; s.agg.G = s.agg.G || {}; s.cared = s.cared || {}; s.tn = s.tn || {};
  s.gate = s.gate || { sem: 0, mult: 0 };
  s.int = s.int || { ok: 0, by: '', d: '' };
  s.set = s.set || {}; if (!s.set.fs) s.set.fs = 18; if (typeof s.set.voice !== 'number') s.set.voice = 0; if (!(s.set.rate > 0) || s.set.rate > 2) s.set.rate = 1;
  s.hls = s.hls || {}; s.chat = s.chat || []; s.fav = s.fav || [];
  s.cert = s.cert || { name: '', d: '' };
  s.pf = s.pf || {}; s.pf.name = s.pf.name || ''; s.pf.term = s.pf.term || ''; s.pf.mentor = s.pf.mentor || ''; s.pf.head = s.pf.head || '';
  return s;
}
function load() { try { var t = localStorage.getItem(KEY); if (t) return fix(JSON.parse(t)); } catch (e) { } return fix({}); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('無法儲存，請檢查瀏覽器設定'); } }

function iconSrc() { var i = document.querySelector('.brandicon'); return i ? i.src : 'icon-192.png'; }
function toast(t) { var el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { el.style.display = 'none'; }, 2200); }
function sheet(html) { $('sheetpan').innerHTML = html; $('sheet').className = 'on'; }
function closeSheet() { $('sheet').className = ''; }
function copyTxt(t) { try { navigator.clipboard.writeText(t).then(function () { toast('已複製'); }, function () { fallbackCopy(t); }); } catch (e) { fallbackCopy(t); } }
function fallbackCopy(t) { var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); toast('已複製'); } catch (e) { toast('請手動複製'); } document.body.removeChild(a); }
function shareTxt(t) { if (navigator.share) { navigator.share({ text: t }).catch(function () { }); } else copyTxt(t); }
function opts(arr, sel) { var s = '', i; for (i = 0; i < arr.length; i++) s += '<option' + (arr[i] === sel ? ' selected' : '') + '>' + esc(arr[i]) + '</option>'; return s; }
function rerender() { var y = window.scrollY; render(); window.scrollTo(0, y); }

/* ---------- 進度 ---------- */
function les(n) { return DATA[n - 1]; }
function tasksDone(n) { var L = S.les[n], c = 0, i; for (i = 0; i < les(n).tasks.length; i++) if (L.tk[i]) c++; return c; }
function lesDone(n) { return !!S.les[n].done; }
function lesCount() { var c = 0, n; for (n = 1; n <= NLES; n++) if (lesDone(n)) c++; return c; }
function lesStarted(n) { var L = S.les[n], k; for (k in L.hl) return true; for (k in L.st) return true; for (k in L.tk) if (L.tk[k]) return true; return L.sc !== null || L.pos > 0; }
function cnt() { var r = 0, w; for (w in S.tn) if (S.tn[w].sent) r++; return { one: S.one.length, obs: S.obs.length, rep: r }; }
function gateOk() { return !!(S.gate.sem || S.gate.mult); }
function credit() { var c = cnt(); return lesCount() === NLES && gateOk() && c.one >= GOAL.one && c.obs >= GOAL.obs && c.rep >= GOAL.rep && S.int.ok; }

/* ---------- 路由 ---------- */
function go(h) { location.hash = h; }
window.onhashchange = function () { ttsStop(); qsa('.hlsheet-mask').forEach(function (x) { x.parentNode.removeChild(x); }); closeSheet(); render(); window.scrollTo(0, 0); };
function render() {
  document.documentElement.style.setProperty('--fs', S.set.fs + 'px');
  if (!S.auth.ok) { renderLock(); return; }
  var h = (location.hash || '#home').slice(1).split('/');
  var v = h[0];
  if (v === 'les') renderLesson(+h[1], h[2] || 'script');
  else if (v === 'intern') renderIntern();
  else if (v === 't') renderTool(h[1]);
  else if (v === 'set') renderSet();
  else if (v === 'cert') renderCert();
  else if (v === 'chat') renderChat();
  else if (v === 'fav') renderFav();
  else if (v === 'hls') renderHls();
  else renderHome();
}
function topbar(title, back) { return '<div class="top"><button class="back" onclick="go(\'' + (back || 'home') + '\')">‹ 返回</button><h1>' + esc(title) + '</h1></div>'; }

/* ---------- 授權 ---------- */
function renderLock() {
  $('app').innerHTML = '<div class="lock"><img class="homeicon" style="width:88px;height:88px;border-radius:22px;margin-bottom:14px" alt="" src="' + iconSrc() + '"><h1 style="margin:0">' + APPNAME + '</h1><p class="muted">' + COURSE + '・六課＋一學期見習</p><div class="card"><b>🔒 開通</b><p class="muted">請輸入學神院發給你的<b>助教（或負責人）身分碼</b>；預備成為見習助教的小家長，可輸入小家長身分碼或本課程授權碼。</p><input type="text" id="code" placeholder="身分碼或授權碼" autocomplete="off"><button class="btn" onclick="unlock()">開通</button><div id="lockmsg"></div></div></div>';
}
function unlock(c) {
  var raw = c || ($('code') && $('code').value) || '', v = norm(raw), role = roleOfCode(raw);
  if (role || (v && ACCESS.indexOf(hash(v)) >= 0)) {
    S.auth = { ok: 1, d: today(), role: role || 'course' }; save(); toast(role ? '歡迎，' + ROLE_NAME[role] : '課程已開通');

  }
  if (!c) $('lockmsg').innerHTML = '<div class="warnbox">代碼不正確。請輸入學神院發給你的身分碼，或本課程授權碼。</div>';
  return false;
}

/* ---------- 助教五盞燈 ---------- */
function lamps() {
  var L = S.led, i, ok1 = L.length > 0, ok2 = L.length > 0, t0 = termStart();
  for (i = 0; i < L.length; i++) {
    if (daysSince(lastOne(L[i].id)) > 31) ok1 = false;
    if (obsCount(L[i].id, t0) < 2) ok2 = false;
  }
  var w = lastRepWeek(), care = w ? careAll(w) : [], c3 = care.length ? care.every(function (x) { return S.cared[x.k]; }) : !!w;
  var tn = S.tn[w || curWeek()] || {}, ok4 = !!tn.hw;
  var weeks = Math.max(0, Math.min(SXY.weeks, rawWeek())), sent = cnt().rep, ok5 = weeks > 0 && sent / weeks >= 0.8;
  return [
    ['一對一', ok1, L.length ? '每位小家長 31 天內都約談過' : '先到「我的小家長」建立名冊'],
    ['列席', ok2, '本學期每個小家至少列席兩次'],
    ['關懷追蹤', c3, w ? '第 ' + w + ' 週需關懷 ' + care.length + ' 人，' + care.filter(function (x) { return S.cared[x.k]; }).length + ' 人已確認有人跟進' : '尚未匯入小家週報'],
    ['作業回饋', ok4, '本週作業 7 天內回饋八成以上（在助教週報勾選）'],

  const GXD = {"keys": ["adult", "teen", "kid", "seeker", "elder", "single_parent", "single", "parent", "couple", "pastor"], "icon": {"adult": "🧑", "teen": "🧒", "kid": "🧸", "seeker": "🌱", "elder": "👴", "single_parent": "👩‍👧", "single": "🙋", "parent": "👨‍👩‍👧", "couple": "💑", "pastor": "⛪"}, "names": {"adult": "成人", "teen": "青少年", "kid": "兒童", "seeker": "慕道友", "elder": "長輩", "single_parent": "單親", "single": "單身", "parent": "父母", "couple": "夫妻", "pastor": "牧者"}, "hints": {"adult": "有深度，貼近工作、家庭與關係", "teen": "幽默風趣、不說教，用你的世界來比喻", "kid": "非常簡單好懂，像在聽故事", "seeker": "還沒信主也聽得懂，不說教，給實際的幫助", "elder": "尊敬溫和、慢慢說，句子清楚好懂", "single_parent": "先接住你的辛苦，給做得到的小步驟與盼望", "single": "真誠平等，不催婚，談身分、等待與使命", "parent": "貼近養兒育女的日常：溝通、管教、陪伴與禱告", "couple": "夫妻同行：溝通、饒恕、同心與一起禱告", "pastor": "同工口吻：牧養、講道預備、團隊與不倦怠"}, "lenNames": {"brief": "簡要", "mid": "適中", "full": "詳細"}, "len": {"brief": " 回答長度：簡要。整段回答控制在 3～5 句話（約 150 字內）：直接給核心答案、一句關鍵經文或一個比喻，最後一句禱告或一個小步驟。不用表格、不列長清單。", "full": " 回答長度：詳細。請完整、有條理地回答（約 800～1200 字）：說明經文脈絡、關鍵字詞的意思、相關經文對照、清楚的321應用、這星期可以操練的具體步驟，最後以禱告結束。可用簡短小標題。"}, "aud": {"adult": {"sys": " 回答對象：成年人。請用成熟、沉穩而溫暖的口吻，可以有適度的深度：點出經文脈絡與關鍵字詞的意思，連結工作、婚姻、教養、人際與屬靈爭戰，最後帶出一個這星期就能操練的具體步驟。", "write": "\n讀者是成年人：口吻成熟、溫暖、真誠。", "style": "風格：沉穩清楚；其中一兩題帶出生命應用。", "res": ["再讀一遍這章，細細品味，下次會更好。", "不錯！這章的信息已經進到你裡面了。", "太棒了！經文的話已經住在你心裡。"], "q": ["這段經文讓我看見神是怎樣的一位神？", "這段經文照出我裡面什麼樣的舊人有己？", "若讓耶穌在這件事上作王，我會怎麼做？", "這段經文中，耶穌給我看見什麼樣的榜樣？", "聖靈要藉這段話引導我今天走哪一步？", "這裡的人為什麼會失敗？根源是驕傲還是恐懼？", "這段經文如何幫助我操練無己的生命？", "我可以把這段經文用在與誰的關係上？", "這段經文與主禱文「願你的國降臨」有什麼關聯？", "請用一個比喻幫我明白這段經文的核心。"], "fu": [["💍", "婚姻", "請針對你剛才的回答，說明怎麼把它應用在夫妻關係與婚姻裡，並給我一個這個星期可以做的具體小步驟。"], ["👨‍👩‍👧", "家庭", "請針對你剛才的回答，說明怎麼把它應用在家庭與教養孩子（或與父母相處）上，並給我一個這個星期可以做的具體小步驟。"], ["💼", "職場", "請針對你剛才的回答，說明怎麼把它應用在工作與職場上（同事、主管、壓力、誠信），並給我一個這個星期可以做的具體小步驟。"], ["🏡", "日常", "請針對你剛才的回答，說明怎麼把它應用在日常生活的小事上（時間、金錢、習慣），並給我一個這個星期可以做的具體小步驟。"], ["💭", "內心", "請針對你剛才的回答，說明怎麼把它應用在面對內心的情緒與軟弱上（焦慮、憤怒、驕傲），並給我一個這個星期可以做的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段簡短、真誠的禱告，讓我可以拿來禱告。"]]}, "teen": {"sys": " 回答對象：青少年（約12–18歲）。請用幽默風趣、輕鬆有梗的口吻，像一位很酷的大哥哥大姊姊在聊天，不說教、不居高臨下。多用他們熟悉的世界來比喻：手機剩1%電量、遊戲過關、追劇、社群按讚與追蹤數、考試、同儕壓力、打球。可以適度用一點流行說法和小玩笑，但絕不拿聖經、神或耶穌開玩笑，也不輕看罪與傷痛；笑完一定要回到經文的真理上。答案精簡，重點先講，段落要短，結尾給一個今天就能試的小挑戰。若他提到被欺負、受傷害或想傷害自己，要溫柔回應，並鼓勵他馬上告訴信任的大人（爸媽、老師、牧者）。", "write": "\n讀者是青少年：口氣輕鬆幽默、像朋友聊天，可以有一點梗，但不說教、不輕浮、不拿神和聖經開玩笑；不要用表情符號。", "style": "風格：題目與解析的口氣幽默風趣、輕鬆有梗（像在跟朋友鬥嘴），選項可以有趣，但正確答案必須明確、不含糊，絕不拿神與聖經開玩笑。", "res": ["哎呀，這章有點滑溜～再讀一次，下一局你就是王者！", "不賴喔！再練幾次就可以去嘲笑你的朋友了（開玩笑的）。", "滿分級的操作！聖經達人就是你！"], "q": ["這段經文跟我的日常（學校、朋友、手機）有什麼關係？", "如果這段經文是神傳給我的一則訊息，它想說什麼？", "朋友都那樣做，我不跟會不會很怪？經文怎麼看？", "用遊戲或電影來比喻這段經文，可以嗎？", "這段經文有什麼讓人意外、很少人知道的地方？", "考試壓力好大，這段經文能給我什麼力量？", "我很難原諒一個人，這段經文能幫我什麼？", "神真的看得到我嗎？我哪裡值得被愛？"], "fu": [["🏫", "學校", "用你剛才講的，幫我想想怎麼用在學校與課業上，給我一個今天就能試的小招。"], ["🤝", "朋友", "用你剛才講的，幫我想想怎麼用在朋友相處上，給我一個今天就能試的小招。"], ["🏠", "家人", "用你剛才講的，幫我想想怎麼用在跟爸媽、家人的相處上，給我一個今天就能試的小招。"], ["📱", "手機網路", "用你剛才講的，幫我想想怎麼用在手機、網路與社群上，給我一個今天就能試的小招。"], ["💭", "壓力", "用你剛才講的，幫我想想怎麼用在壓力和情緒上，給我一個今天就能試的小招。"], ["🌟", "未來", "用你剛才講的，幫我想想怎麼用在未來和夢想上，給我一個今天就能試的小招。"], ["🎯", "今天挑戰", "請給我一個跟剛才有關、今天就能完成的小挑戰，要具體、有點好玩。"]]}, "kid": {"sys": " 回答對象：兒童（約5–11歲）。請用非常淺顯易懂的話，像說故事給小朋友聽。句子要短，一句只講一件事；用具體的小事當比喻（種子、小熊、手牽手、捉迷藏、生日蛋糕）；不用艱深的神學名詞，必須用時馬上用一句話解釋。語氣親切活潑，可以說「你知道嗎？」「一起想一想」，並適度加幾個可愛的表情符號。整個回答控制在五到七句短句。不要用表格；只引用一節簡短的經文。遇到暴力或可怕的經文，用孩子能承受的方式溫柔帶過，不渲染細節。最後用一句小禱告或一個孩子答得出來的簡單問題作結。若孩子說有人傷害他、或他很難過，要親切回應，並告訴他馬上跟信任的大人（爸爸媽媽、老師、牧者）說。", "write": "\n讀者是小朋友：用非常簡單的字詞和短句，像說故事，一句只講一件事，不用艱深名詞；不要用表情符號。", "style": "風格：給5到11歲的小朋友，字詞非常簡單、句子很短，像在說故事；選項要短；解析一句話、親切，最多加一個可愛的表情符號。", "res": ["沒關係！我們再讀一次故事，再玩一次就會了！🌱", "好棒喔！你記得好多！🌟", "哇！太厲害了！神一定很高興！🎉"], "q": ["這段故事在說什麼？請講給我聽。", "神在這個故事裡做了什麼事？", "耶穌愛我嗎？我怎麼知道？", "這個故事裡誰最勇敢？為什麼？", "我可以怎樣學習故事裡的人？", "請教我一句可以背起來的短經文。", "我跟好朋友吵架了，耶穌會怎麼做？", "可以教我做一個小禱告嗎？"], "fu": [["🏠", "在家", "剛剛講的，我在家裡可以怎麼做呢？請用簡單的話告訴我。"], ["🏫", "在學校", "剛剛講的，我在學校可以怎麼做呢？請用簡單的話告訴我。"], ["🤝", "跟朋友", "剛剛講的，我在跟好朋友相處時可以怎麼做呢？請用簡單的話告訴我。"], ["🙏", "小禱告", "請教我一個很短的小禱告，我可以跟耶穌說。"], ["📖", "小故事", "可以再講一個跟這個有關的小故事給我聽嗎？"]]}, "seeker": {"sys": " 回答對象：慕道友（還沒有信主、正在了解基督信仰的朋友）。請完全站在他的立場和角度：他可能沒讀過聖經、不懂教會用語，心裡有疑問，甚至有些保留。①先從他真實的生活處境、感受或疑問切入，再帶到經文，讓他覺得「這跟我有關」。②用最平常的話說；321理念只是你心裡的方向，不要在回答裡出現「無己、作王、得勝、屬靈」這類內部用語，也不用教會與神學術語；一定要提到的詞（如恩典、罪、救恩），馬上用生活的說法解釋。③誠實、尊重、不說教、不施壓、不要求他現在就相信，也不論斷他；有疑問或質疑很正常，先認真承認那個問題的份量，再誠實回答。④清楚說出聖經在這件事上的真理（神是怎樣的神、耶穌為我們做了什麼），用故事、比喻和日常例子，讓他聽得懂、記得住。⑤一定要有實際有用的幫助：給一兩個他這個星期就能自己試試看的小步驟（一個觀察、一個提問、一個簡單的行動）。⑥合適時，可以溫和邀請他繼續探索（例如讀一小段、問一個問題），不要硬把話題轉到決志。⑦不要說「我們基督徒都知道」這類預設他已經信的話。引用經文用和合本，並用白話解釋它的意思。若寫到禱告，只當作「若你願意，可以這樣對神說」的邀請，不強迫。整個回答要簡明、段落要短。", "write": "\n讀者是還沒信主的朋友：用生活化、親切、不說教的話，不用教會術語，不預設他已經信；不要用表情符號。", "style": "風格：給還沒信主、沒讀過聖經的人。題目要把背景交代清楚（人物、事件的名字直接寫出來），不假設他懂聖經或教會用語；用字平實，解析用一句白話說明這件事對一般人有什麼意義。", "res": ["沒關係，剛接觸這些內容本來就不容易，再看一遍會更清楚。", "不錯喔！你已經抓到這一章的重點了。", "太厲害了！你對這一章的內容很清楚。"], "q": ["這段話跟我現在的生活有什麼關係？", "我還不是基督徒，這段話對我有什麼意義？", "神真的存在嗎？有什麼理由可以相信？", "聖經為什麼說每個人都需要耶穌？", "我壓力很大，聖經能給我什麼實際的幫助？", "這段話裡的「罪」是什麼意思？跟我有關嗎？", "基督徒常說的「恩典」，用白話說是什麼？", "如果我想多了解，可以從哪裡開始？"], "fu": [["🤝", "人際", "剛才說的放在人際關係裡（家人、朋友、同事），對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💍", "婚姻家庭", "剛才說的放在婚姻與家庭裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💼", "工作", "剛才說的放在工作與職場裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["😟", "壓力焦慮", "剛才說的放在壓力與焦慮裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["🌍", "人生意義", "剛才說的放在尋找人生的意義與方向裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["❓", "我的疑問", "我心裡還有疑問，請誠實告訴我：信耶穌對一個人的生活到底有什麼實際的幫助？也請告訴我可以怎麼自己去查證。"], ["🌱", "下一步", "如果我想進一步了解，下一步可以做什麼？請給我一兩個不會有壓力的建議。"]]}, "elder": {"sys": " 回答對象：長輩（約65歲以上）。請用尊敬、溫和、慢慢說的口吻，像晚輩敬重地陪長輩讀經；句子清楚、不拐彎，不用網路用語和英文縮寫；比喻取自一生的閱歷（田地、家人、歲月、病痛、孫子、老街坊）。重點先講，分成短段落，不要太長。肯定他們一生走過的路與在主裡的忠心，不說教、不指責、不用「你應該」。可以談健康與軟弱、孤單、放下與交託、把信仰傳給下一代、永恆的盼望與感恩。結尾給一件簡單、容易做到的小事（一句禱告、打電話問候家人、數算一件感謝）。若提到身體不適、孤單或失去親人，要先溫柔安慰，並鼓勵他和家人、教會關懷同工聯絡。", "write": "\n讀者是長輩：用語尊敬、溫和、清楚好懂，不用網路用語；不要用表情符號。", "style": "風格：給長輩，字詞平實、句子清楚，題目不要繞、不要太冷僻，選項簡短；解析用一句溫和的話。", "res": ["沒關係，慢慢來，再讀一遍會更清楚。", "很好！這一章的話您記得不少。", "太好了！神的話已經住在您心裡。"], "q": ["這段經文用最簡單的話，是在說什麼？", "這段經文對年紀大的人有什麼安慰？", "身體漸漸衰弱了，神怎麼看顧我？", "我常常覺得孤單，這段經文能給我什麼？", "我該怎麼把信仰傳給兒孫？", "有些事放不下，這段經文怎麼教我交託？", "我老了，還能為神做什麼？", "請幫我寫一段簡短的禱告，我想念給主聽。"], "fu": [["🩺", "健康", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在身體的軟弱與健康，並給我一個這個星期做得到的具體小步驟。"], ["🤍", "孤單", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在孤單與思念，並給我一個這個星期做得到的具體小步驟。"], ["👨‍👩‍👧‍👦", "兒孫", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在和兒孫、家人的關係，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "交託", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在放下心中的牽掛、交託給主，並給我一個這個星期做得到的具體小步驟。"], ["🌅", "盼望", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在永恆的盼望與感恩，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，用簡單的話寫成一段短短的禱告，讓我可以慢慢念給主聽。"]]}, "single_parent": {"sys": " 回答對象：單親爸爸或媽媽（一個人撐起一個家）。請先接住他的辛苦：他常常很累、有愧疚、有孤單，也有經濟、時間與教養的壓力。口吻溫暖、接納、不評斷，不追問過去的原因，不說「你應該再找個伴」，也不把單親說成缺憾。引用神的心意：神是孤兒的父、寡婦的伸冤者（詩篇68:5），祂與我們同在。再給盼望與實際：每一個小步驟都要在忙碌中做得到（五分鐘禱告、跟孩子的一個小儀式、開口向弟兄姊妹求助）。內容簡短、段落要短。結尾給一個這個星期做得到的小步驟。若他提到被暴力對待、疲憊到撐不下去或想傷害自己，要溫柔回應，並鼓勵他立刻聯絡信任的人、教會同工或專業協助。", "write": "\n讀者是單親爸媽：口吻溫暖、接納、不評斷，肯定他的辛苦；不要用表情符號。", "style": "風格：給單親爸媽，題目貼近日常的忙碌、教養與盼望；口氣溫暖，解析一句話帶出安慰。", "res": ["沒關係，您已經很努力了，有空再讀一遍就好。", "不錯！在這麼忙的日子裡還記得這麼多。", "太棒了！神的話正在托住您。"], "q": ["這段經文對一個人撐起一個家的我，有什麼安慰？", "我常常覺得累，也覺得對孩子有虧欠，神怎麼看？", "神怎麼看顧孤兒和寡婦？這跟我有什麼關係？", "經濟壓力很大，這段經文能給我什麼？", "孩子在頂嘴、情緒很大，我該怎麼辦？", "我不知道怎麼跟孩子說爸爸（或媽媽）不在身邊的事。", "我真的很孤單，可以怎麼向教會或弟兄姊妹開口求助？", "請幫我寫一段五分鐘內能禱告完的短禱告。"], "fu": [["😮‍💨", "疲累", "請針對你剛才的回答，說明怎麼把它用在一個人撐家的疲累與內疚，並給我一個這個星期做得到的具體小步驟。"], ["👧", "孩子", "請針對你剛才的回答，說明怎麼把它用在陪伴孩子與教養，並給我一個這個星期做得到的具體小步驟。"], ["💰", "經濟", "請針對你剛才的回答，說明怎麼把它用在經濟與時間的壓力，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "求助", "請針對你剛才的回答，說明怎麼把它用在向弟兄姊妹或教會開口求助，並給我一個這個星期做得到的具體小步驟。"], ["🌤️", "盼望", "請針對你剛才的回答，說明怎麼把它用在在這個階段看見神的同在與盼望，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我在忙碌中五分鐘內就能禱告完的短禱告。"]]}, "single": {"sys": " 回答對象：單身的人（可能未婚、離婚、喪偶，或正在等候；不要預設他想結婚或不想結婚）。請不要把單身說成缺憾、「預備期」或「還沒到的人生」，也不要用催婚的口氣。談在基督裡的身分已經完整、被愛；談孤單時怎麼與神、與朋友、與團契連結；談時間、金錢與恩賜的運用與使命；談等待中的信靠；談感情與婚姻的智慧，以及在情感與身體上的聖潔，態度要尊重、不論斷。口吻真誠、平等、輕鬆。結尾給一個這個星期可以做的小步驟。若他提到孤單到想傷害自己，要溫柔回應並鼓勵他立刻聯絡信任的人或專業協助。", "write": "\n讀者是單身朋友：口吻真誠、平等、輕鬆，不催婚、不把單身說成缺憾；不要用表情符號。", "style": "風格：給單身的朋友，題目貼近孤單、身分、等待、友誼與使命；口氣真誠平等，不催婚。", "res": ["沒關係，慢慢來，再讀一遍就會更清楚。", "不錯喔！你把這一章的重點抓到了。", "太棒了！你很認真，神的話正在你裡面扎根。"], "q": ["單身的我，這段經文想對我說什麼？", "我覺得孤單，這段經文能給我什麼？", "在基督裡，我的身分和價值是什麼？", "等待的時候，要怎麼信靠神？", "感情的事，聖經給我什麼智慧？", "單身的時間和精力，可以怎麼為神所用？", "怎樣在教會和朋友中建立好的關     });

  async function hymnFetch(s) {
    const tries = songBase[s.f] != null ? [songBase[s.f]] : ['', 'music/'];
    let why = '';
    for (const b of tries) {
      try {
        const r = await fetch(SITE + b + encodeURIComponent(s.f), { mode: 'cors' });
        if (!r.ok) { why = 'HTTP ' + r.status; continue; }
        const blob = await r.blob();

        songBase[s.f] = b;
        return blob;

    }
    throw new Error(why || 'fail');

  /* ── 離開 App 再回來（或被系統重載）時接回原位：相機（10 分鐘內、且不在內嵌視窗）→ AI 配樂 → AI 生圖（12 小時內） ── */
  function resumeBoot() {
    let o = null, mode = '';
    if (!isFramed()) { o = lsTake('cam'); if (o && o.item && Date.now() - o.ts <= 10 * 60 * 1000) mode = 'cam'; else o = null; }
    if (!mode) { o = lsTake('mu'); if (o && o.item && Date.now() - o.ts <= 12 * 3600 * 1000) mode = 'mu'; else o = null; }
    if (!mode) { o = lsTake('ai'); if (o && o.item && Date.now() - o.ts <= 12 * 3600 * 1000) mode = 'ai'; else o = null; }
    if (!mode) return;
    let tries = 0;
    const iv = setInterval(() => {
      tries++;
      let ready = false;
      try { ready = !!(D && D.txt && S); } catch (e) { ready = false; }
      if (!ready) { if (tries > 40) clearInterval(iv); return; }

  /* ── iOS 分段 MP4 重新封裝（mx_*，照抄互動聖經，勿改）── */
function mx_u32(b,p){return b[p]*16777216+b[p+1]*65536+b[p+2]*256+b[p+3];}
function mx_i32(b,p){const v=mx_u32(b,p);return v>=2147483648?v-4294967296:v;}
function mx_u64(b,p){return mx_u32(b,p)*4294967296+mx_u32(b,p+4);}
function mx_typ(b,p){return String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);}

function mx_boxes(b,start,end){
  const out=[];let p=start;
  while(p+8<=end){
    let size=mx_u32(b,p),hs=8;
    if(size===1){size=mx_u64(b,p+8);hs=16;}
    else if(size===0)size=end-p;
    if(size<8||p+size>end)break;
    out.push({type:mx_typ(b,p+4),start:p,size:size,hs:hs,body:p+hs,end:p+size});
    p+=size;
  }

}
function mx_find(list,t){return list.filter(x=>x.type===t);}
function mx_one(list,t){const r=mx_find(list,t);return r.length?r[0]:null;}
function mx_children(b,mx_box){return mx_boxes(b,mx_box.body,mx_box.end);}

function mx_parseTrun(b,tr,tfhd,baseOffset){
  const flags=mx_u32(b,tr.body)&0xffffff;
  const cnt=mx_u32(b,tr.body+4);
  let p=tr.body+8;
  let dataOff=0;
  if(flags&0x1){dataOff=mx_i32(b,p);p+=4;}
  let firstFlags=null;
  if(flags&0x4){firstFlags=mx_u32(b,p);p+=4;}
  const samples=[];
  let off=baseOffset+dataOff;
  for(let i=0;i<cnt;i++){
    let dur=tfhd.defDur, size=tfhd.defSize, fl=tfhd.defFlags, cto=0;
    if(flags&0x100){dur=mx_u32(b,p);p+=4;}
    if(flags&0x200){size=mx_u32(b,p);p+=4;}
    if(flags&0x400){fl=mx_u32(b,p);p+=4;}
    if(flags&0x800){cto=mx_i32(b,p);p+=4;}
    if(i===0&&firstFlags!==null)fl=firstFlags;
    samples.push({off:off,size:size,dur:dur,cto:cto,sync:!(fl&0x10000)});
    off+=size;
  }

function mx_parseTfhd(b,mx_box){

  const trackId=mx_u32(b,mx_box.body+4);
  let p=mx_box.body+8;
  let base=null;
  if(flags&0x1){base=mx_u64(b,p);p+=8;}
  if(flags&0x2){p+=4;}
  let defDur=0,defSize=0,defFlags=0;
  if(flags&0x8){defDur=mx_u32(b,p);p+=4;}
  if(flags&0x10){defSize=mx_u32(b,p);p+=4;}
  if(flags&0x20){defFlags=mx_u32(b,p);p+=4;}

/* ---- 產生 mx_box ---- */
function mx_box(type,...parts){

function mx_b64(v){const hi=Math.floor(v/4294967296),lo=v>>>0;

function mx_remux(bytes){

        const hasOff=!!(flags&0x1);
        const r=mx_parseTrun(b,tr,tfhd,hasOff?base:(running===null?base:running));
        r.samples.forEach(s=>t.samples.push(s));
        if(r.samples.length){
          const last=r.samples[r.samples.length-1];
          running=last.off+last.size;
        }
      });
    });
  });

  /* 依序把 sample 資料集中成一個 mdat */
  const order=[];
  Object.keys(tracks).forEach(id=>{
    tracks[id].samples.forEach((s,i)=>order.push({id:+id,i:i,off:s.off,size:s.size}));
  });
  order.sort((a,b2)=>a.off-b2.off);
  let mdatSize=0;order.forEach(o=>mdatSize+=o.size);

  const newOff={};

    const newTraks=[];

      const tkc=mx_children(b,tk);

  out.set(ftypBuf,p);p+=ftypBuf.length;
  out.set(moovNew,p);p+=moovNew.length;
  out.set(mdatHead,p);p+=16;

      catch (e) { recMode = 'c'; camFail(e); paint(); }

    }

      try { if (bgmURL) URL.revokeObjectURL(bgmURL); } catch (_) {}
      try { if (ac) ac.close(); } catch (_) {}

adius:6px;flex:0 0 auto;margin-top:3px; display:grid;place-items:center;font-size:13px;color:#fff}\n.gxsmask .chk.on .box,#gxuBox .chk.on .box,#gxuPanel .chk.on .box{background:var(--pine);border-color:var(--pine)}\n.gxsmask .chk.on .t,#gxuBox .chk.on .t,#gxuPanel .chk.on .t{color:var(--dusk);text-decoration:line-through}\n.gxsmask .chk .t,#gxuBox .chk .t,#gxuPanel .chk .t{flex:1;font-size:15px;line-height:1.7}\n.gxsmask .note,#gxuBox .note,#gxuPanel .note{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card); color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical}\n.gxsmask .hr,#gxuBox .hr,#gxuPanel .hr{height:1px;background:var(--line);margin:22px 0}\n.gxsmask .btn.danger,#gxuBox .btn.danger,#gxuPanel .btn.danger{color:var(--clay);border-color:var(--clay)}\n.gxsmask .btn.xs2,#gxuBox .btn.xs2,#gxuPanel .btn.xs2{font-size:12.5px;padding:6px 11px}\n\n#gxuFab{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);width:46px;height:46px;border-radius:50%;border:0;background:#1F4D3D;color:#fff;font-size:21px;z-index:95;box-shadow:0 3px 12px rgba(0,0,0,.28);opacity:.94;display:grid;place-items:center;cursor:pointer;padding:0}\n#gxuFab.hasSel{outline:3px solid #D4A65B;animation:gxuPulse 1.2s ease-in-out 3}\n@keyframes gxuPulse{50%{transform:scale(1.12)}}\nhtml[data-gxs=\"1\"] #gxuFab{display:none}\n#gxuPanel,#gxuBox{position:fixed;inset:0;z-index:185;display:none}\n#gxuPanel.on,#gxuBox.on{display:flex}\n#gxuPanel{background:rgba(10,16,14,.5);align-items:flex-end;justify-content:center}\n#gxuPanel .gxuc{background:#F7F8F4;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 30px rgba(0,0,0,.25)}\n#gxuPanel h4{margin:0 0 8px;font-family:var(--serif);font-size:18px}\n#gxuPanel textarea{min-height:120px;resize:vertical}\n#gxuPanel .row{margin-top:10px}\n#gxuBox{background:var(--paper);flex-direction:column;overflo let lastSel = '', lastAt = 0, selT = 0;
function mountFab() {
  injectCss();
  if (!CFG.fab || $1('#gxuFab')) return;
  const f = document.createElement('button'); f.id = 'gxuFab'; f.type = 'button'; f.textContent = '🖼';
  f.setAttribute('aria-label', 'Card studio');
  f.onclick = openPanel;
  document.body.appendChild(f);
  document.addEventListener('selectionchange', () => {
    let s = ''; try { s = String(window.getSelection ? window.getSelection() : '').replace(/\s+/g, ' ').trim(); } catch (e) {}
    if (s.length >= 2 && s.length <= 1500) { lastSel = s; lastAt = Date.now(); f.classList.add('hasSel'); }
    else { clearTimeout(selT); selT = setTimeout(() => { if (Date.now() - lastAt > 1800) f.classList.remove('hasSel'); }, 2200); }
  });
}
function openPanel() {
  curL = langNow();
  let p = $1('#gxuPanel');
  if (!p) { p = document.createElement('div'); p.id = 'gxuPanel'; document.body.appendChild(p); p.addEventListener('click', e => { if (e.target === p) p.classList.remove('on'); }); }
  const pre = (Date.now() - lastAt < 90000) ? lastSel : '';
  p.innerHTML = '<div class="gxuc"><h4>🖼 ' + tt('美圖工作室', 'Card studio') + '</h4>' +
    '<p class="hint">' + tt('在畫面上選取一段話再按這顆鈕，會自動帶進來；也可以自己貼上或輸入。', 'Select some text on the page, then tap this button — it fills in here. You can also paste or type your own.') + '</p>' +
    '<textarea id="gxuIn" placeholder="' + tt('想做成美圖的話…', 'The words for your card…') + '"></textarea>' +
    '<div class="row"><button class="btn pri" id="gxuMk">🖼 ' + tt('做成美圖', 'Make a card') + '</button><button class="btn" id="gxuWk">📂 ' + tt('我的作品', 'My creations') + '</button><button class="btn" id="gxuCl">' + tt('關閉', 'Close') + '</button></div></div>';
  p.classList.add('on');
  const ta = $1('#gxuIn'); ta.value = pre;
  $1('#gxuCl').onclick = () => p.classList.remove('on');
  $1('#gxuWk').onclick = () => { p.classList.remove('on'); openWorks(); };
  $1('#gxuMk').onclick = () => {
    const t = ta.value.trim();
    if (!t) { toastMsg(tt('先選取或貼上一段話', 'Select or paste some text first')); return; }
    p.classList.remove('on');
    lastSel = ''; API.open({ text: t, ref: CFG.bz, plain: true });
  };
  try { if (curL === 'sc') scWalk(p); } catch (e) {}
}
/* ── 小智回答下方的「做成美圖」 ── */
function txtOf(el) { const c = el.cloneNode(true); c.querySelectorAll('[data-gxu],button').forEach(x => x.remove()); return (c.innerText || c.textContent || '').trim(); }
function mountAnswers() {
  if (!CFG.ans) return;
  const A = CFG.ans; let t = 0;
  const scan = () => {
    document.querySelectorAll(A.sel).forEach(el => {
      if (el.querySelector('[data-gxu]')) return;
      const body = A.body === ':self' ? el : el.querySelector(A.body); if (!body) return;
      const txt = txtOf(body); if (txt.length < 8) return;
      const act = (A.act && el.querySelector(A.act)) || el;
      const b = document.createElement('button');
      b.type = 'button'; b.setAttribute('data-gxu', '1'); b.className = A.btn || 'msg-act';
      b.textContent = '🖼 ' + tt('做成美圖', 'Card');
      b.onclick = e => {
        e.stopPropagation();
        let q = '';
        const qq = el.querySelector('.msg-q'); if (qq) q = qq.innerText || '';
        if (!q) { let p = el.previousElementSibling; while (p && !q) { if (p.matches && p.matches(A.user || '.msg.user')) q = p.innerText || ''; p = p.previousElementSibling; } }
        API.answer(txtOf(body), q);
      };
      act.appendChild(b);
    });
  };
  new MutationObserver(() => { clearTimeout(t); t = setTimeout(scan, 250); }).observe(document.body, { childList: true, subtree: true });
  scan();
}
const API = {
  ready: () => true, cfg: CFG,
  open(o) { const g = ensure(); return g.open(o); },
  answer(text, q) { const g = ensure(); return g.fromAnswer(text, q); },
  works: openWorks, panel: openPanel,
  state: () => STATE
};
window.GXU = API;
const start = () => { try { mountFab(); mountAnswers(); injectCss(); } catch (e) {} };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
